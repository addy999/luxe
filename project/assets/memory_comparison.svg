<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="230" rx="16" fill="#1c1c1c"/>

  <text x="30" y="38" fill="#e6e6e6" font-size="18" font-weight="600">Memory to open the same RAW photo</text>
  <text x="30" y="58" fill="#8a8a8a" font-size="12">idle, same image, both apps freshly opened</text>

  <!-- darktable row -->
  <text x="30" y="108" fill="#cfcfcf" font-size="14">darktable</text>
  <rect x="140" y="90" width="500" height="28" rx="5" fill="#3a3a3a"/>
  <text x="652" y="110" fill="#e6e6e6" font-size="14" font-weight="600">1.43 GB</text>

  <!-- Luxe row -->
  <text x="30" y="160" fill="#cfcfcf" font-size="14">Luxe</text>
  <rect x="140" y="142" width="185" height="28" rx="5" fill="#4a9de0"/>
  <text x="337" y="162" fill="#e6e6e6" font-size="14" font-weight="600">530 MB</text>

  <text x="30" y="206" fill="#8bc4ef" font-size="14" font-weight="600">~2.7x less memory</text>
</svg>
