name: smoke tests

# Backend-free unit tests only: the pure-logic tests under
# project/tests/unit/ (EditStore / Library / RejectStore / UiState /
# Filmstrip) run on a bare Godot headless binary with no GDExtension and no
# darktable build. The per-slider feature tests and the RAW->PNG / full-UI
# oracles need the compiled libdt_backend + a darktable build, so they stay
# local / in the pre-commit hook and are intentionally not run here.
#
# The set is whatever scripts/run_unit_tests.sh globs out of
# project/tests/unit/, so adding a backend-free test needs no change here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-free:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6-beta3"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot headless
        run: |
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -L "$url" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import project (build the global class cache)
        run: |
          rm -f project/dt_backend.gdextension
          godot --headless --path project --import

      - name: Run backend-free unit tests
        run: scripts/run_unit_tests.sh godot
